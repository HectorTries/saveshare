<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snowball Speedrun • Target Speedrun</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Manrope:wght@500;600;700&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --sky-top:#4A5A72; --sky-mid:#7C93AC; --sky-bottom:#E4EFF5;
    --deep-navy:#16283D; --frost-blue:#3E92CC; --mint-melt:#5FC9A8;
    --ember:#FF6B4A; --gold:#F2B84B; --wood:#C17A4A;
  }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; background:#0f1a2e; color:#fff; font-family:'Manrope',sans-serif; overflow:hidden; }
  #sky { position:fixed; inset:0; background:linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 45%, var(--sky-bottom) 100%); z-index:-3; }
  #mountains { position:fixed; bottom:0; left:0; right:0; width:100%; height:38vh; z-index:-2; opacity:0.65; }
  #snowCanvas { position:fixed; inset:0; z-index:-1; pointer-events:none; }
  #aurora { position:fixed; top:0; left:0; right:0; height:40vh; z-index:-1; opacity:0; background:linear-gradient(120deg, rgba(95,201,168,.45), rgba(62,146,204,.35), rgba(255,182,140,.35)); filter:blur(40px); mix-blend-mode:screen; }

  .wrap { position:relative; height:100vh; display:flex; flex-direction:column; }
  .topbar { display:flex; align-items:center; justify-content:space-between; padding:16px 20px; background:rgba(22,40,61,.85); backdrop-filter:blur(12px); border-bottom:1px solid rgba(255,255,255,.1); z-index:10; }
  .topbar .left { display:flex; align-items:center; gap:16px; }
  .logo { font-family:'Baloo 2',sans-serif; font-size:22px; font-weight:800; letter-spacing:-0.5px; }
  .stat { font-family:'JetBrains Mono',monospace; font-size:13px; background:rgba(255,255,255,.1); padding:4px 12px; border-radius:999px; }
  .progress { flex:1; max-width:420px; height:10px; background:rgba(255,255,255,.15); border-radius:999px; overflow:hidden; margin:0 20px; }
  .progress-bar { height:100%; background:linear-gradient(90deg,#5FC9A8,#F2B84B); transition:width .1s linear; }
  .game-container { flex:1; position:relative; display:flex; align-items:center; justify-content:center; }
  #game { border-radius:12px; box-shadow:0 20px 60px rgba(0,0,0,.5); background:rgba(255,255,255,.03); }
  .slingshot-area { height:140px; background:rgba(22,40,61,.9); display:flex; align-items:center; justify-content:center; border-top:1px solid rgba(255,255,255,.1); z-index:10; }
  .slingshot { width:120px; height:80px; position:relative; }
  .slingshot .band { position:absolute; top:32px; height:4px; background:#8B6F47; }
  .slingshot .left { left:0; width:38px; }
  .slingshot .right { right:0; width:38px; }
  .slingshot .pouch { position:absolute; left:50%; top:18px; width:32px; height:32px; background:#3E92CC; border-radius:50%; transform:translateX(-50%); box-shadow:inset -4px -4px 6px rgba(0,0,0,.3), 0 4px 12px rgba(0,0,0,.3); cursor:grab; }
  .slingshot .pouch:active { cursor:grabbing; }

  .overlay { position:absolute; inset:0; display:none; align-items:center; justify-content:center; background:rgba(15,26,46,.92); z-index:20; }
  .overlay.show { display:flex; }
  .modal { background:#1a2a45; border-radius:20px; padding:32px 40px; text-align:center; max-width:420px; box-shadow:0 30px 80px rgba(0,0,0,.6); }
  .modal h2 { font-family:'Baloo 2',sans-serif; font-size:28px; margin:0 0 8px; }
  .stats { display:flex; gap:24px; justify-content:center; margin:24px 0; }
  .stat-big { text-align:center; }
  .stat-big .num { font-family:'JetBrains Mono',monospace; font-size:32px; font-weight:700; }
  .stat-big .label { font-size:12px; opacity:.7; margin-top:2px; }
  .btn { background:#5FC9A8; color:#16283D; border:none; padding:14px 32px; font-size:15px; font-weight:700; border-radius:999px; cursor:pointer; margin-top:12px; }
  .btn.secondary { background:rgba(255,255,255,.1); color:#fff; }
</style>
</head>
<body>
<div id="sky"></div>
<svg id="mountains" viewBox="0 0 1000 300" preserveAspectRatio="none"><polygon points="0,300 0,190 120,110 230,175 340,90 460,180 560,120 680,200 800,130 900,190 1000,150 1000,300" fill="#9FB7CC"/><polygon points="0,300 0,230 100,170 210,220 330,150 440,215 540,165 650,225 760,175 880,230 1000,190 1000,300" fill="#6E88A2"/></svg>
<canvas id="snowCanvas"></canvas>
<div id="aurora"></div>

<div class="wrap">
  <div class="topbar">
    <div class="left">
      <div class="logo">❄️ Snowball</div>
      <div class="stat" id="goalText">Goal: £0 / £0</div>
    </div>
    <div class="progress"><div class="progress-bar" id="progressBar" style="width:0%"></div></div>
    <div style="display:flex;gap:12px;align-items:center">
      <div class="stat" id="timer">00:00</div>
      <div class="stat" id="shots">Shots: 0</div>
    </div>
  </div>

  <div class="game-container">
    <canvas id="game" width="720" height="620"></canvas>
  </div>

  <div class="slingshot-area">
    <div class="slingshot" id="slingshot">
      <div class="band left"></div>
      <div class="band right"></div>
      <div class="pouch" id="pouch"></div>
    </div>
  </div>
</div>

<div class="overlay" id="winOverlay">
  <div class="modal">
    <h2>Speedrun Complete!</h2>
    <div class="stats">
      <div class="stat-big"><div class="num" id="finalTime">00:00</div><div class="label">TIME</div></div>
      <div class="stat-big"><div class="num" id="finalShots">0</div><div class="label">SHOTS</div></div>
      <div class="stat-big"><div class="num" id="finalStars">★★★</div><div class="label">RATING</div></div>
    </div>
    <button class="btn" onclick="restartGame()">Play Again</button>
    <button class="btn secondary" onclick="shareRun()" style="margin-left:8px">Share Speedrun</button>
  </div>
</div>

<script>
// ===== Snowfall =====
const snowCanvas = document.getElementById('snowCanvas');
const sctx = snowCanvas.getContext('2d');
let W = window.innerWidth, H = window.innerHeight;
snowCanvas.width = W; snowCanvas.height = H;
let flakes = [];
function makeFlake() { return {x:Math.random()*W, y:Math.random()*-H, r:Math.random()*2+1, spd:Math.random()*0.7+0.3, drift:Math.random()*0.5-0.25, o:Math.random()*0.5+0.3}; }
for(let i=0;i<80;i++) flakes.push(makeFlake());
function tickSnow() {
  sctx.clearRect(0,0,W,H);
  sctx.fillStyle = 'rgba(255,255,255,0.9)';
  flakes.forEach(f => {
    f.y += f.spd; f.x += f.drift;
    if(f.y > H) { f.y = -4; f.x = Math.random()*W; }
    sctx.globalAlpha = f.o;
    sctx.beginPath(); sctx.arc(f.x,f.y,f.r,0,Math.PI*2); sctx.fill();
  });
  sctx.globalAlpha = 1;
  requestAnimationFrame(tickSnow);
}
tickSnow();
window.addEventListener('resize', () => { W=window.innerWidth; H=window.innerHeight; snowCanvas.width=W; snowCanvas.height=H; });

// ===== Game =====
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d', { alpha: true });

let goal = 0;
let melted = 0;
let shots = 0;
let startTime = 0;
let timerInterval = null;
let blocks = [];
let projectiles = [];
let isDragging = false;
let dragStart = {x:0,y:0};
let pouch = document.getElementById('pouch');

const BLOCK_TYPES = {
  ice:   { value: 3, color: '#A8D5E5', hp: 1, name: 'Ice' },
  wood:  { value: 7, color: '#C17A4A', hp: 2, name: 'Wood' },
  tnt:   { value: 14, color: '#FF6B4A', hp: 1, name: 'TNT', explosive: true }
};

function createTower(amount) {
  blocks = [];
  goal = amount;
  melted = 0;
  const towerWidth = 280;
  const startX = canvas.width/2 - towerWidth/2;
  const baseY = canvas.height - 80;
  const blockH = 38;
  const blockW = 56;

  // Build a satisfying tower (mix of materials)
  const rows = Math.max(5, Math.min(9, Math.floor(amount / 18) + 4));
  let currentY = baseY;

  for (let r = 0; r < rows; r++) {
    const isEven = r % 2 === 0;
    const rowWidth = isEven ? 5 : 4;
    const offset = isEven ? 0 : blockW * 0.5;

    for (let c = 0; c < rowWidth; c++) {
      let type = 'ice';
      if (r < 2) type = 'tnt';           // Top = high interest
      else if (r < 4) type = 'wood';     // Middle = medium
      else type = 'ice';                 // Bottom = easy

      blocks.push({
        x: startX + offset + c * blockW,
        y: currentY,
        w: blockW - 4,
        h: blockH - 4,
        type,
        hp: BLOCK_TYPES[type].hp,
        vx: 0, vy: 0,
        angle: 0,
        angular: 0
      });
    }
    currentY -= blockH - 6;
  }
}

function updateProgress() {
  const pct = goal > 0 ? Math.min(100, (melted / goal) * 100) : 0;
  document.getElementById('progressBar').style.width = pct + '%';
  document.getElementById('goalText').textContent = `Goal: £${melted} / £${goal}`;
  if (melted >= goal && !document.getElementById('winOverlay').classList.contains('show')) {
    endRun();
  }
}

function updateTimer() {
  if (!startTime) return;
  const elapsed = Math.floor((Date.now() - startTime) / 1000);
  const min = String(Math.floor(elapsed / 60)).padStart(2,'0');
  const sec = String(elapsed % 60).padStart(2,'0');
  document.getElementById('timer').textContent = `${min}:${sec}`;
}

function updateShots() {
  document.getElementById('shots').textContent = `Shots: ${shots}`;
}

function draw() {
  ctx.clearRect(0,0,canvas.width,canvas.height);

  // Ground
  ctx.fillStyle = '#2A3F5F';
  ctx.fillRect(0, canvas.height-60, canvas.width, 80);

  // Draw blocks
  blocks.forEach(b => {
    if (b.hp <= 0) return;
    const t = BLOCK_TYPES[b.type];
    ctx.save();
    ctx.translate(b.x + b.w/2, b.y + b.h/2);
    ctx.rotate(b.angle);

    ctx.fillStyle = t.color;
    ctx.fillRect(-b.w/2, -b.h/2, b.w, b.h);

    // Highlight
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.fillRect(-b.w/2 + 4, -b.h/2 + 4, b.w - 8, 8);

    // Cracks for damaged blocks
    if (b.hp < t.hp) {
      ctx.strokeStyle = 'rgba(0,0,0,0.4)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(-b.w/4, -b.h/4);
      ctx.lineTo(b.w/5, b.h/5);
      ctx.stroke();
    }

    // TNT label
    if (b.type === 'tnt') {
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 11px JetBrains Mono';
      ctx.fillText('TNT', -12, 4);
    }

    ctx.restore();
  });

  // Draw projectiles
  ctx.fillStyle = '#fff';
  projectiles.forEach(p => {
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.beginPath();
    ctx.arc(p.x-3, p.y-3, p.r*0.4, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#fff';
  });

  // Slingshot rubber bands
  if (isDragging) {
    const pouchRect = pouch.getBoundingClientRect();
    const gameRect = canvas.getBoundingClientRect();
    const sx = pouchRect.left + 16 - gameRect.left;
    const sy = pouchRect.top + 16 - gameRect.top;
    ctx.strokeStyle = '#8B6F47';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(280, 560);
    ctx.lineTo(sx, sy);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(440, 560);
    ctx.lineTo(sx, sy);
    ctx.stroke();
  }
}

function physicsStep() {
  const gravity = 0.28;
  const friction = 0.985;

  // Projectiles
  for (let i = projectiles.length-1; i>=0; i--) {
    const p = projectiles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += gravity;
    p.vx *= friction;

    // Collision with blocks
    for (let j = blocks.length-1; j>=0; j--) {
      const b = blocks[j];
      if (b.hp <= 0) continue;
      if (p.x > b.x && p.x < b.x + b.w && p.y > b.y && p.y < b.y + b.h) {
        // Hit!
        b.hp -= 1;
        b.vx += p.vx * 0.6;
        b.vy += p.vy * 0.6;
        b.angular += (p.vx - p.vy) * 0.02;

        const value = BLOCK_TYPES[b.type].value;
        melted += value;
        updateProgress();

        // Explosive TNT
        if (b.type === 'tnt' && b.hp <= 0) {
          explode(b);
        }

        projectiles.splice(i,1);
        break;
      }
    }

    if (p.y > canvas.height + 40) projectiles.splice(i,1);
  }

  // Block physics
  blocks.forEach(b => {
    if (b.hp <= 0) return;
    b.x += b.vx;
    b.y += b.vy;
    b.vy += 0.18;
    b.vx *= 0.96;
    b.vy *= 0.96;
    b.angle += b.angular;
    b.angular *= 0.92;

    // Floor collision
    if (b.y + b.h > canvas.height - 60) {
      b.y = canvas.height - 60 - b.h;
      b.vy = -b.vy * 0.35;
      b.vx *= 0.7;
    }
  });
}

function explode(centerBlock) {
  const cx = centerBlock.x + centerBlock.w/2;
  const cy = centerBlock.y + centerBlock.h/2;

  blocks.forEach(b => {
    if (b.hp <= 0) return;
    const dx = (b.x + b.w/2) - cx;
    const dy = (b.y + b.h/2) - cy;
    const dist = Math.sqrt(dx*dx + dy*dy) || 1;
    if (dist < 180) {
      b.vx += (dx/dist) * 9;
      b.vy += (dy/dist) * 9 - 3;
      b.angular += (Math.random()-0.5)*0.3;
      if (b.type !== 'tnt') b.hp = Math.max(0, b.hp - 1);
    }
  });
}

function gameLoop() {
  physicsStep();
  draw();
  requestAnimationFrame(gameLoop);
}

function startTimer() {
  if (timerInterval) clearInterval(timerInterval);
  startTime = Date.now();
  timerInterval = setInterval(updateTimer, 250);
}

function endRun() {
  clearInterval(timerInterval);
  const elapsed = Math.floor((Date.now() - startTime) / 1000);
  const min = String(Math.floor(elapsed/60)).padStart(2,'0');
  const sec = String(elapsed%60).padStart(2,'0');

  document.getElementById('finalTime').textContent = `${min}:${sec}`;
  document.getElementById('finalShots').textContent = shots;

  const efficiency = shots <= 3 ? 3 : shots <= 6 ? 2 : 1;
  document.getElementById('finalStars').textContent = '★'.repeat(efficiency) + '☆'.repeat(3-efficiency);

  document.getElementById('winOverlay').classList.add('show');
}

function restartGame() {
  document.getElementById('winOverlay').classList.remove('show');
  const amount = parseInt(prompt('How much do you want to melt? (£)', '85')) || 85;
  createTower(amount);
  projectiles = [];
  shots = 0;
  melted = 0;
  startTime = 0;
  document.getElementById('progressBar').style.width = '0%';
  document.getElementById('goalText').textContent = `Goal: £0 / £${amount}`;
  document.getElementById('timer').textContent = '00:00';
  document.getElementById('shots').textContent = 'Shots: 0';
  updateProgress();
}

function launchSnowball(sx, sy, ex, ey) {
  const dx = ex - sx;
  const dy = ey - sy;
  const power = Math.min(18, Math.sqrt(dx*dx + dy*dy) * 0.09);

  const angle = Math.atan2(dy, dx);
  const vx = Math.cos(angle) * power * -1.2;
  const vy = Math.sin(angle) * power * -1.2;

  projectiles.push({
    x: sx,
    y: sy,
    r: 9,
    vx: vx,
    vy: vy
  });

  shots++;
  updateShots();

  if (!startTime) startTimer();
}

// Mouse / Touch controls for slingshot
const pouchEl = document.getElementById('pouch');
let startDragX = 0, startDragY = 0;

function getGameCoords(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: clientX - rect.left,
    y: clientY - rect.top
  };
}

pouchEl.addEventListener('mousedown', (e) => {
  isDragging = true;
  const rect = pouchEl.getBoundingClientRect();
  startDragX = rect.left + 16;
  startDragY = rect.top + 16;
  pouchEl.style.transition = 'none';
});

document.addEventListener('mousemove', (e) => {
  if (!isDragging) return;
  const gameRect = canvas.getBoundingClientRect();
  const pouchRect = pouchEl.getBoundingClientRect();
  const currentX = e.clientX;
  const currentY = e.clientY;

  // Limit drag distance
  const maxPull = 90;
  const dx = currentX - startDragX;
  const dy = currentY - startDragY;
  const dist = Math.sqrt(dx*dx + dy*dy);
  const scale = dist > maxPull ? maxPull / dist : 1;

  const newX = startDragX + dx * scale - (pouchRect.width/2);
  const newY = startDragY + dy * scale - (pouchRect.height/2);

  pouchEl.style.left = (newX - gameRect.left) + 'px';
  pouchEl.style.top = (newY - gameRect.top) + 'px';
});

document.addEventListener('mouseup', (e) => {
  if (!isDragging) return;
  isDragging = false;

  const gameRect = canvas.getBoundingClientRect();
  const pouchRect = pouchEl.getBoundingClientRect();
  const endX = pouchRect.left + 16 - gameRect.left;
  const endY = pouchRect.top + 16 - gameRect.top;

  // Reset pouch
  pouchEl.style.transition = 'all 0.2s cubic-bezier(0.2,0.8,0.2,1)';
  pouchEl.style.left = '50%';
  pouchEl.style.top = '18px';

  // Launch
  const startX = 360;
  const startY = 540;
  launchSnowball(startX, startY, endX, endY);
});

// Touch support
pouchEl.addEventListener('touchstart', (e) => {
  isDragging = true;
  const rect = pouchEl.getBoundingClientRect();
  startDragX = rect.left + 16;
  startDragY = rect.top + 16;
  e.preventDefault();
});

document.addEventListener('touchend', (e) => {
  if (!isDragging) return;
  isDragging = false;
  const gameRect = canvas.getBoundingClientRect();
  const pouchRect = pouchEl.getBoundingClientRect();
  const endX = pouchRect.left + 16 - gameRect.left;
  const endY = pouchRect.top + 16 - gameRect.top;

  pouchEl.style.transition = 'all 0.2s cubic-bezier(0.2,0.8,0.2,1)';
  pouchEl.style.left = '50%';
  pouchEl.style.top = '18px';

  launchSnowball(360, 540, endX, endY);
  e.preventDefault();
});

// Keyboard: space to restart
document.addEventListener('keydown', (e) => {
  if (e.key === ' ' && document.getElementById('winOverlay').classList.contains('show')) {
    e.preventDefault();
    restartGame();
  }
});

// Boot
function init() {
  createTower(85);
  updateProgress();
  gameLoop();

  // Auto-start hint
  setTimeout(() => {
    if (!startTime) {
      document.getElementById('goalText').textContent = 'Goal: £0 / £85  •  Drag the snowball!';
    }
  }, 1800);
}

init();
</script>
</body>
</html>
