<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SaveShare • UK Financial Influencers</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#0f172a;color:#fff;min-height:100vh}
.container{max-width:1200px;margin:0 auto;padding:20px}
header{padding:60px 0 40px;text-align:center}
h1{font-size:3rem;margin-bottom:10px}h1 span{color:#00d4aa}
p{color:#94a3b8;max-width:600px;margin:0 auto}
.filters{display:flex;justify-content:center;gap:10px;margin:20px 0}
.fil{background:#1e293b;border:1px solid #334155;color:#94a3b8;padding:8px 16px;border-radius:20px;cursor:pointer}
.fil:hover,.fil.active{background:#00d4aa;color:#0f172a}
.card{background:#1e293b;border:1px solid #334155;border-radius:12px;margin:8px;padding:16px;display:inline-block;width:240px;text-decoration:none;color:inherit;vertical-align:top;transition:.2s}
.card:hover{border-color:#00d4aa;transform:translateY(-4px)}
.card-header{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.avatar{width:44px;height:44px;background:linear-gradient(135deg,#00d4aa,#00b894);border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;color:#0f172a;font-size:1rem}
.card-header h2{margin:0;font-size:1rem}.handle{color:#64748b;font-size:0.85rem}
.followers{color:#94a3b8;font-size:0.8rem;margin:8px 0}
.value{font-size:1.4rem;color:#00d4aa;font-weight:700;margin:8px 0}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.tag{background:rgba(100,116,139,0.2);color:#94a3b8;padding:3px 7px;border-radius:10px;font-size:0.7rem}
.articles{font-size:0.8rem;color:#00d4aa;margin-top:8px}
.stats-bar{display:flex;justify-content:center;gap:60px;padding:30px 0;border-top:1px solid #1e293b;margin-top:40px}
.stat{text-align:center}.stat-num{font-size:2rem;font-weight:700;color:#00d4aa}.stat-label{color:#64748b}
</style>
</head>
<body>
<header class="container">
<h1>Save<span>Share</span></h1>
<p>UK financial influencers – portfolios, insights & advice.</p>
</header>
<main class="container">
<div class="filters"><button class="fil active" data-f="all">All</button></div>
<div id="g"></div>
</main>
<footer class="container">
<div class="stats-bar">
<div class="stat"><span class="stat-num" id="ti">0</span><div class="stat-label">Influencers</div></div>
<div class="stat"><span class="stat-num" id="tw">£0</span><div class="stat-label">Total Net Worth</div></div>
</div>
<p style="text-align:center;color:#475569;padding:20px">SaveShare • Not financial advice</p>
</footer>
<script>
var data=[
{id:"james-money-stocker",name:"James Money Stocker",handle:"@jamesmoneystocker",followers:0,total:209000,tags:["stocks","lisa"]},
{id:"trading-traveling",name:"Trading & Traveling",handle:"@tradingandtraveling",followers:0,total:131000,tags:["stocks"]},
{id:"neil-invests",name:"Neil Invests",handle:"@neilinvests",followers:0,total:120000,tags:["stocks"]},
{id:"dr-jubair",name:"Dr Jubair's Finance",handle:"@drjubairsfinance",followers:0,total:114700,tags:["stocks"]},
{id:"ben-finance",name:"BenFinance",handle:"@benfinance",followers:0,total:109000,tags:["stocks"]},
{id:"mia-rose",name:"Mia Rose",age:25,handle:"@miarosemcgrath",followers:550000,total:200000,tags:["stocks","isa"],"article":"blog/mia-rose-article.html"},
{id:"seans-money",name:"Sean's Money",handle:"@seansmoney",followers:0,total:122000,tags:["stocks","lisa"]}
];

function fm(a){return a>=1000?"£"+(a/1000).toFixed(0)+"k":"£"+a}
function gi(n){return n.split(" ").map(w=>w[0]).join("").substring(0,2)}
function fc(n){return n>=1000?"@"+(n/1000).toFixed(0)+"k":"@"+n}

data.forEach(x=>{
var el=document.createElement("a");
el.href=x.article?"https://saveshare.io/"+x.article:"#";
el.className="card";
var flw=x.followers>0?'<div class="followers">'+fc(x.followers)+' followers</div>':'';
var art=x.article?'<div class="articles">📄 View portfolio →</div>':'';
el.innerHTML='<div class="card-header"><div class="avatar">'+gi(x.name)+'</div><div><h2>'+x.name+'</h2><div class="handle">'+x.handle+'</div></div></div>'+flw+'<div class="value">'+fm(x.total)+'</div><div class="tags">'+x.tags.map(t=>'<span class="tag">'+t+'</span>').join('')+'</div>'+art;
document.getElementById("g").appendChild(el);
});
var tot=data.reduce((a,b)=>a+b.total,0);
document.getElementById("ti").innerText=data.length;
document.getElementById("tw").innerText=tot>=1000000?"£"+(tot/1000000).toFixed(1)+"M":"£"+(tot/1000).toFixed(0)+"k";
</script>
</body>
</html>
