<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SaveShare - UK Financial Influencers</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
*{box-sizing:border-box}
body{margin:0;padding:20px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#fff}
.container{max-width:900px;margin:0 auto}
h1{text-align:center;font-size:2.5rem;margin-bottom:5px}
h1 span{color:#00d4aa}
.subtitle{text-align:center;color:#64748b;margin-bottom:30px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:15px}
.card{background:#1e293b;border:1px solid #334155;border-radius:10px;padding:15px;text-decoration:none;color:#fff;display:block;transition:0.2s}
.card:hover{border-color:#00d4aa;transform:translateY(-2px)}
.rank{background:#00d4aa;color:#0f172a;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:0.85rem;width:28px;height:28px;border-radius:50%;margin-bottom:8px}
.img{width:60px;height:60px;border-radius:50%;object-fit:cover;margin-bottom:8px;background:#334155}
.name{font-weight:600;margin-bottom:3px}
.handle{color:#64748b;font-size:0.85rem}
.net{color:#00d4aa;font-size:1.1rem;font-weight:600;margin:8px 0}
.tags{display:flex;gap:5px;flex-wrap:wrap}
.tag{background:#334155;color:#94a3b8;padding:2px 8px;border-radius:4px;font-size:0.75rem}
.power{color:#f97316;font-size:0.8rem;margin-top:5px}
.gain{color:#10b981;font-size:0.8rem}
.trend{color:#10b981;font-size:0.75rem}
.stats{display:flex;justify-content:center;gap:40px;padding:25px 0;border-top:1px solid #1e293b;margin-top:25px}
.statItem{text-align:center}
.statNum{font-size:1.8rem;color:#00d4aa;font-weight:bold}
.statLabel{font-size:0.8rem;color:#64748b}
</style>
</head>
<body>
<div class="container">
<h1>Save<span>Share</span></h1>
<p class="subtitle"><nav><a href="/stats.html" style="color:#64748b;font-size:0.9rem;margin-bottom:20px">View Stats</a></nav>
<p class="subtitle">UK Financial Influencers <a href="/stats.html" style="color:#00d4aa;font-size:0.9rem">[View Stats]</a></p>
<div class="grid" id="grid"></div>
<div class="stats">
<div class="statItem"><div class="statNum" id="totalInf">0</div><div class="statLabel">Influencers</div></div>
<div class="statItem"><div class="statNum" id="totalNet">£0</div><div class="statLabel">Total Net Worth</div></div>
</div>
</div>
<script>
var data=[
{id:"mia-rose",name:"Mia Rose",handle:"@miarosemcgrath",followers:550000,age:25,networth:200000,power:603053,tags:["stocks"],image:"images/mia-rose-cover.png",history:[
{date:"2025-06-01",amount:50000},
{date:"2025-11-01",amount:157969},
{date:"2026-05-01",amount:200000}
]},
{id:"sophie-blank",name:"Sophie Blank",handle:"@itssophieblank",followers:0,age:28,networth:200000,power:75894,tags:["wealth"]},
{id:"james-money-stocker",name:"James Money Stocker",handle:"@jamesmoneystocker",followers:0,age:35,networth:465000,power:147045,tags:["stocks"],image:"images/james.png",history:[
{date:"2024-01-01",amount:280000},
{date:"2025-04-01",amount:436500},
{date:"2026-04-01",amount:465000}
]},
{id:"hannah-bevington",name:"Hannah Bevington",handle:"@hannahbevington",followers:0,age:24,networth:120000,power:49873,tags:["saving"],image:"images/hannah.png",history:[
{date:"2024-01-01",amount:10000},
{date:"2025-01-01",amount:45000},
{date:"2025-12-01",amount:90000},
{date:"2026-05-01",amount:120000}
]},
{id:"seans-money",name:"Sean's Money",handle:"@seansmoney",followers:0,age:26,networth:122000,power:48500,tags:["stocks"]},
{id:"trading-traveling",name:"Trading & Traveling",handle:"@tradingandtraveling",followers:0,age:32,networth:131000,power:44976,tags:["stocks"]},
{id:"neil-invests",name:"Neil Invests",handle:"@neilinvests",followers:0,age:29,networth:120000,power:44452,tags:["stocks"]},
{id:"ben-finance",name:"BenFinance",handle:"@benfinance",followers:0,age:27,networth:109000,power:42347,tags:["stocks"]},
{id:"dr-jubair",name:"Dr Jubair's Finance",handle:"@drjubairsfinance",followers:0,age:35,networth:200000,power:64000,tags:["stocks"],image:"images/jubair.png",history:[
{date:"2024-01-01",amount:114700},
{date:"2026-04-01",amount:180000},
{date:"2026-05-01",amount:200000}
]}
];

function calcGain(h){
if(!h||h.length<2)return null;
var first=h[0].amount,last=h[h.length-1].amount,change=last-first,pct=((change/first)*100).toFixed(0),firstDate=new Date(h[0].date),lastDate=new Date(h[h.length-1].date),mos=((lastDate-firstDate)/(1000*60*60*24*30)).toFixed(1);
return{gain:change,pct:pct,months:mos};
}
data.sort(function(a,b){return b.power-a.power});
data.forEach(function(d,i){d.rank=i+1;d.gain=calcGain(d.history)});
var total=0;
var gridEl=document.getElementById("grid");
data.forEach(function(d){
total+=d.networth;
var v=d.networth>=1000?((d.networth)/1000).toFixed(0)+"K":"£"+d.networth;
var tagsHtml=d.tags.map(function(t){return'<span class="tag">'+t+'</span>'}).join("");
var flwTxt=d.followers>0?'<div style="color:#64748b;font-size:0.8rem">'+Math.round(d.followers/1000)+'K followers</div>':'';
var imgHtml=d.image?'<img src="'+d.image+'" class="img" alt="'+d.name+'">':'<div class="rank">'+d.rank+'</div>';
var gainTxt=d.gain?'<div class="gain">+£'+(d.gain.gain/1000).toFixed(0)+'K ↑'+d.gain.pct+'%</div><div class="trend">since '+d.gain.months+'mo</div>':'';
gridEl.innerHTML+='<a href="/influencer/'+d.id+'.html" class="card">'+imgHtml+'<div class="name">'+d.name+'</div><div class="handle">'+d.handle+'</div>'+flwTxt+'<div class="net">£'+v+'</div><div class="tags">'+tagsHtml+'</div>'+gainTxt+'</a>';
});
document.getElementById("totalInf").innerText=data.length;
document.getElementById("totalNet").innerText="£"+(total>=1000000?(total/1000000).toFixed(1)+"M":"£"+(total/1000).toFixed(0)+"K");
</script>
</body>
</html>
