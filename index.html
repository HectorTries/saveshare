<style>
:root {
    --bg: #0f172a;
    --bg-soft: #1e293b;
    --border: #334155;
    --text: #f8fafc;
    --text-soft: #cbd5e1;
    --text-muted: #64748b;
    --teal: #00d4aa;
    --teal-2: #00b894;
    --orange: #f97316;
    --green: #10b981;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html { scroll-behavior: smooth; }

body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    line-height: 1.5;
    position: relative;
    overflow-x: hidden;
}

/* Subtle background gradient */
body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
        radial-gradient(ellipse 60% 50% at 50% 0%, rgba(0, 212, 170, 0.10) 0%, transparent 60%),
        radial-gradient(ellipse 40% 40% at 100% 100%, rgba(249, 115, 22, 0.05) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
}

.container {
    max-width: 1100px;
    margin: 0 auto;
    padding: 64px 24px 32px;
    position: relative;
    z-index: 1;
}

.header {
    text-align: center;
    margin-bottom: 48px;
}

h1 {
    font-size: clamp(2.2rem, 5vw, 3rem);
    font-weight: 800;
    letter-spacing: -0.03em;
    margin-bottom: 14px;
    line-height: 1.1;
}

h1 span {
    background: linear-gradient(135deg, var(--teal) 0%, var(--teal-2) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    color: var(--teal);
}

.subtitle {
    color: var(--text-muted);
    font-size: 1.05rem;
    margin-bottom: 6px;
}

.subtitle a {
    color: var(--teal);
    text-decoration: none;
    font-size: 0.9rem;
    margin-left: 6px;
    border-bottom: 1px solid transparent;
    transition: border-color 0.2s;
}

.subtitle a:hover { border-bottom-color: var(--teal); }

/* Grid */
.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 18px;
    margin-bottom: 56px;
}

.card {
    background: var(--bg-soft);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px;
    text-decoration: none;
    color: var(--text);
    display: block;
    transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1), border-color 0.25s, box-shadow 0.25s;
    position: relative;
    overflow: hidden;
}

.card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--teal), var(--orange));
    opacity: 0;
    transition: opacity 0.25s;
}

.card:hover {
    transform: translateY(-3px);
    border-color: var(--teal);
    box-shadow: 0 14px 32px rgba(0, 0, 0, 0.35), 0 0 0 1px rgba(0, 212, 170, 0.25);
}

.card:hover::before { opacity: 1; }

.rank {
    background: var(--teal);
    color: var(--bg);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 0.85rem;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    margin-bottom: 12px;
    box-shadow: 0 2px 10px rgba(0, 212, 170, 0.35);
}

.img {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    object-fit: cover;
    margin-bottom: 12px;
    background: var(--border);
    border: 2px solid var(--border);
}

.name {
    font-weight: 600;
    font-size: 1rem;
    margin-bottom: 4px;
    letter-spacing: -0.01em;
}

.handle {
    color: var(--text-muted);
    font-size: 0.85rem;
    margin-bottom: 6px;
}

.followers {
    color: var(--text-muted);
    font-size: 0.8rem;
    margin-bottom: 4px;
}

.net {
    color: var(--teal);
    font-size: 1.2rem;
    font-weight: 700;
    margin: 10px 0 8px;
    letter-spacing: -0.02em;
}

.tags {
    display: flex;
    gap: 5px;
    flex-wrap: wrap;
    margin: 8px 0;
}

.tag {
    background: rgba(51, 65, 85, 0.6);
    color: var(--text-soft);
    padding: 3px 9px;
    border-radius: 5px;
    font-size: 0.72rem;
    font-weight: 500;
    text-transform: lowercase;
    letter-spacing: 0.02em;
}

.power {
    color: var(--orange);
    font-size: 0.78rem;
    margin-top: 8px;
    font-weight: 600;
}

.gain {
    color: var(--green);
    font-size: 0.85rem;
    font-weight: 600;
}

.trend {
    color: var(--green);
    font-size: 0.72rem;
    opacity: 0.8;
}

/* Stats Banner */
.stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 16px;
    padding: 32px 0;
    border-top: 1px solid var(--border);
    margin-top: 8px;
}

.statItem {
    text-align: center;
    padding: 24px 20px;
    background: var(--bg-soft);
    border: 1px solid var(--border);
    border-radius: 14px;
}

.statNum {
    font-size: 2.2rem;
    color: var(--teal);
    font-weight: 800;
    letter-spacing: -0.02em;
    margin-bottom: 6px;
    line-height: 1;
}

.statLabel {
    font-size: 0.78rem;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-weight: 500;
}

/* Footer */
footer {
    text-align: center;
    padding: 32px 20px 40px;
    color: var(--text-muted);
    font-size: 0.85rem;
    border-top: 1px solid var(--border);
    margin-top: 24px;
    position: relative;
    z-index: 1;
}

footer p { margin-bottom: 6px; }

footer a {
    color: var(--teal);
    text-decoration: none;
    transition: opacity 0.2s;
}

footer a:hover { opacity: 0.7; }

/* Mobile */
@media (max-width: 600px) {
    .container { padding: 40px 16px 24px; }
    .header { margin-bottom: 36px; }
    .stats { grid-template-columns: 1fr 1fr; gap: 10px; }
    .statItem { padding: 18px 12px; }
    .statNum { font-size: 1.7rem; }
    .statLabel { font-size: 0.7rem; }
}
</style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>Save<span>Share</span></h1>
        <p class="subtitle">UK Financial Influencers <a href="/stats.html">View Stats →</a></p>
    </div>

    <div class="grid" id="grid"></div>

    <div class="stats">
        <div class="statItem"><div class="statNum" id="totalInf">0</div><div class="statLabel">Influencers</div></div>
        <div class="statItem"><div class="statNum" id="totalNet">£0</div><div class="statLabel">Total Net Worth</div></div>
    </div>
</div>

<footer>
    <p>SaveShare • Not financial advice</p>
    <p>A directory of UK personal finance creators and their portfolios.</p>
</footer>

<script>
var data=[
{id:"mia-rose",name:"Mia Rose",handle:"@miarosemcgrath",followers:550000,age:25,networth:200000,power:603053,tags:["stocks"],image:"images/mia-rose-cover.png",history:[
{date:"2025-06-01",amount:50000},
{date:"2025-11-01",amount:157969},
{date:"2026-05-01",amount:200000}
]},
{id:"sophie-blank",name:"Sophie Blank",handle:"@itssophieblank",followers:0,age:28,networth:200000,power:75894,tags:["wealth"],image:"images/Sophie Blank.png",providers:["trading-212"]},
{id:"james-money-stocker",name:"James Money Stocker",handle:"@jamesmoneystocker",followers:0,age:35,networth:465000,power:147045,tags:["stocks"],image:"images/james.png",history:[
{date:"2024-01-01",amount:280000},
{date:"2025-04-01",amount:436500},
{date:"2026-04-01",amount:465000}
]},
{id:"hannah-bevington",name:"Hannah Bevington",handle:"@hannahbevington",followers:0,age:24,networth:120000,power:49873,tags:["saving"],image:"images/hannah.png",history:[
{date:"2024-01-01",amount:10000},
{date:"2025-01-01",amount:45000},
{date:"2025-12-01",amount:90000},
{date:"2026-05-01",amount:120000}
]},
{id:"seans-money",name:"Sean's Money",handle:"@seansmoney",followers:0,age:26,networth:122000,power:48500,tags:["stocks"]},
{id:"trading-traveling",name:"Trading & Traveling",handle:"@tradingandtraveling",followers:0,age:32,networth:131000,power:44976,tags:["stocks"]},
{id:"neil-invests",name:"Neil Invests",handle:"@neilinvests",followers:0,age:29,networth:120000,power:44452,tags:["stocks"]},
{id:"ben-finance",name:"BenFinance",handle:"@benfinance",followers:0,age:27,networth:109000,power:42347,tags:["stocks"]},
{id:"dr-jubair",name:"Dr Jubair's Finance",handle:"@drjubairsfinance",followers:0,age:35,networth:200000,power:64000,tags:["stocks"],image:"images/jubair.png",history:[
{date:"2024-01-01",amount:114700},
{date:"2026-04-01",amount:180000},
{date:"2026-05-01",amount:200000}
]}
];

function calcGain(h){
if(!h||h.length<2)return null;
var first=h[0].amount,last=h[h.length-1].amount,change=last-first,pct=((change/first)*100).toFixed(0),firstDate=new Date(h[0].date),lastDate=new Date(h[h.length-1].date),mos=((lastDate-firstDate)/(1000*60*60*24*30)).toFixed(1);
return{gain:change,pct:pct,months:mos};
}
data.sort(function(a,b){return b.power-a.power});
data.forEach(function(d,i){d.rank=i+1;d.gain=calcGain(d.history)});
var total=0;
var gridEl=document.getElementById("grid");
data.forEach(function(d){
total+=d.networth;
var v=d.networth>=1000?((d.networth)/1000).toFixed(0)+"K":"£"+d.networth;
var tagsHtml=d.tags.map(function(t){return'<span class="tag">'+t+'</span>'}).join("");
var flwTxt=d.followers>0?'<div class="followers">'+Math.round(d.followers/1000)+'K followers</div>':'';
var imgHtml=d.image?'<img src="'+d.image+'" class="img" alt="'+d.name+'">':'<div class="rank">'+d.rank+'</div>';
var gainTxt=d.gain?'<div class="gain">+£'+(d.gain.gain/1000).toFixed(0)+'K ↑'+d.gain.pct+'%</div><div class="trend">since '+d.gain.months+'mo</div>':'';
gridEl.innerHTML+='<a href="/influencer/'+d.id+'.html" class="card">'+imgHtml+'<div class="name">'+d.name+'</div><div class="handle">'+d.handle+'</div>'+flwTxt+'<div class="net">£'+v+'</div><div class="tags">'+tagsHtml+'</div>'+gainTxt+'</a>';
});
document.getElementById("totalInf").innerText=data.length;
document.getElementById("totalNet").innerText="£"+(total>=1000000?(total/1000000).toFixed(1)+"M":"£"+(total/1000).toFixed(0)+"K");
</script>
</body>
