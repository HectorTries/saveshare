<!DOCTYPE html>
<html lang="en">
<head>
<!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-3T9QS61KD0"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-3T9QS61KD0');

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{NAME}} • SaveShare</title>
    <meta name="theme-color" content="#0f172a">
    <link rel="stylesheet" href="../styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
        }
        .container { max-width: 1000px; margin: 0 auto; padding: 20px; }
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #64748b;
            text-decoration: none;
            margin-bottom: 30px;
        }
        .back-link:hover { color: #00d4aa; }
        .profile-header {
            display: flex;
            gap: 30px;
            align-items: center;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }
        .avatar-large {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00d4aa, #00b894);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            font-weight: 700;
            color: #0f172a;
        }
        .profile-header h1 {
            font-size: 2.5rem;
            margin-bottom: 5px;
        }
        .profile-header .handle {
            color: #64748b;
            font-size: 1.1rem;
        }
        .section {
            background: #1e293b;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 20px;
            border: 1px solid #334155;
        }
        .section h2 {
            font-size: 1.2rem;
            margin-bottom: 20px;
            color: #94a3b8;
        }
        .portfolio-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
        }
        .portfolio-item {
            background: #0f172a;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
        }
        .portfolio-item .label {
            color: #64748b;
            font-size: 0.85rem;
            margin-bottom: 5px;
        }
        .portfolio-item .value {
            font-size: 1.5rem;
            font-weight: 700;
        }
        .portfolio-item.total .value { color: #00d4aa; }
        .articles-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .article-card {
            background: #0f172a;
            padding: 20px;
            border-radius: 12px;
            text-decoration: none;
            color: inherit;
            display: block;
            transition: all 0.2s;
        }
        .article-card:hover {
            border-left: 3px solid #00d4aa;
        }
        .article-card .date {
            color: #64748b;
            font-size: 0.85rem;
            margin-bottom: 8px;
        }
        .article-card h3 {
            font-size: 1.1rem;
            margin-bottom: 8px;
        }
        .article-card .preview {
            color: #94a3b8;
            font-size: 0.95rem;
        }
        .empty-state {
            text-align: center;
            padding: 40px;
            color: #64748b;
        }
    </style>
</head>
<body>
    <main class="container">
        <a href="../index.html" class="back-link">
            <i class="fas fa-arrow-left"></i> Back to all influencers
        </a>
        
        <div class="profile-header">
            <div class="avatar-large">{{INITIALS}}</div>
            <div>
                <h1>{{NAME}}</h1>
                <div class="handle">{{HANDLE}}</div>
            </div>
        </div>
        
        <div class="section">
            <h2><i class="fas fa-wallet"></i> Portfolio</h2>
            <div class="portfolio-grid">
                {{PORTFOLIO_ITEMS}}
                <div class="portfolio-item total">
                    <div class="label">Total</div>
                    <div class="value">£{{TOTAL}}</div>
                </div>
            </div>
        </div>
        
        <div class="section">
            <h2><i class="fas fa-pen"></i> Articles</h2>
            <div class="articles-list" id="articles">
                <div class="empty-state">
                    <p>No articles yet. Paste a transcript and I'll create one!</p>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
